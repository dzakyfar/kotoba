<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315d4b">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<title>Kotoba — Belajar Bahasa Jepang</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f5f0;color:#20231f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,420px);padding:28px;border:1px solid #e5e7df;border-radius:22px;background:#fff;box-shadow:0 12px 36px #263b2b12;text-align:center}
img{width:72px;height:72px}h1{margin:14px 0 6px;font-size:27px}p{color:#70786f;line-height:1.6}#err{color:#b42318;font-size:13px}
</style>
</head>
<body>
<main>
<img src="./icon-192.svg" alt="">
<h1>Kotoba</h1>
<p id="status">Membuka aplikasi…</p>
<p id="err" role="alert"></p>
</main>
<script>
(async()=>{
  const parts = ["payload/part-01.b64","payload/part-02.b64","payload/part-03.b64","payload/part-04.b64","payload/part-05.b64","payload/part-06.b64","payload/part-07.b64","payload/part-08.b64","payload/part-09.b64"];
  if (!("DecompressionStream" in window)) throw new Error("Browser belum mendukung pembukaan aplikasi. Perbarui Chrome.");
  const texts = await Promise.all(parts.map(async path=>{
    const response = await fetch("./"+path, {cache:"no-store"});
    if(!response.ok) throw new Error("File aplikasi tidak ditemukan: "+path);
    return response.text();
  }));
  const b64 = texts.join("").replace(/\s+/g,"");
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.getElementById("status").textContent="Aplikasi belum bisa dibuka.";
  document.getElementById("err").textContent=error?.message||String(error);
});
</script>
</body>
</html>
